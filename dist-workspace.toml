# Winget package metadata for the v1 release process.
# cargo-dist handles the release artifacts configured in Cargo.toml; Winget PRs can
# use these coordinates when publishing from the generated GitHub Release.

[winget]
package_identifier = "zackyalgiffari.ghost-env"
