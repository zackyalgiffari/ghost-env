name: Feature request
description: Suggest an improvement or new capability.
title: "feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or risk should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Ghost-Env do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: security
    attributes:
      label: Security impact
      options:
        - label: This changes how secrets are stored, displayed, masked, exported, or injected.
          required: false
